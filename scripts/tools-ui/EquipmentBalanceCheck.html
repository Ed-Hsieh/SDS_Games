<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <title>Equipment Balance Check</title>
  <style>
    body {
      margin: 24px;
      background: #07101a;
      color: #eaf3ff;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    .card {
      max-width: 980px;
      margin: 0 auto;
      padding: 20px;
      border: 1px solid rgba(122, 169, 199, 0.28);
      border-radius: 8px;
      background: #0e1a24;
    }

    h1 {
      margin-top: 0;
      color: #ffd166;
    }

    p {
      line-height: 1.7;
      color: #c9d6df;
    }

    pre {
      padding: 14px;
      overflow: auto;
      white-space: pre-wrap;
      color: #ffe3a3;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>裝備平衡檢查</h1>
    <p>
      這個檢查器是 Node 腳本，不再提供瀏覽器版資料載入。
      這樣可以避免瀏覽器頁面和實際平衡腳本各自維護一套邏輯。
    </p>
    <p>在專案根目錄執行：</p>
    <pre>node scripts\EquipmentBalanceCheck.js</pre>
    <p>需要 JSON 輸出時執行：</p>
    <pre>node scripts\EquipmentBalanceCheck.js --json</pre>
  </main>
</body>
</html>
