<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <title>Monster Balance Check</title>
  <style>
    body {
      margin: 24px;
      background: #07101a;
      color: #eaf3ff;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    .card {
      max-width: 980px;
      margin: 0 auto;
      padding: 20px;
      border: 1px solid rgba(122, 169, 199, 0.28);
      border-radius: 8px;
      background: #0e1a24;
    }

    h1 {
      margin-top: 0;
      color: #ffd166;
    }

    p {
      line-height: 1.7;
      color: #c9d6df;
    }

    code,
    pre {
      color: #ffe3a3;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
    }

    code {
      padding: 2px 5px;
    }

    pre {
      padding: 14px;
      overflow: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>怪物平衡檢查</h1>
    <p>
      這個檢查器是 Node 腳本，不再提供瀏覽器版資料載入。
      它會使用正式怪物數值、固定等級、目前節奏戰鬥公式與每章可取得裝備進行驗證。
    </p>
    <p>只檢查並輸出報告：</p>
    <pre>node scripts\DifficultyProgressionCheck.mjs</pre>
    <p>檢查器不會自動寫回資料，所有調整都必須修改正式數值表後重新驗證。</p>
  </main>
</body>
</html>
