<main class="combat-demo" data-combat-demo>
    <div class="combat-demo-stage" data-combat-stage aria-label="第一章 3D 冒險測試"></div>

    <header class="combat-demo-title">
        <span data-room-kicker>第一章驗證區域</span>
        <strong data-room-name>南門外營火</strong>
    </header>

    <section class="combat-demo-player-hud" aria-label="玩家狀態">
        <div class="combat-demo-player-line">
            <strong>旅人</strong>
            <span data-potion-count>應急藥劑 3</span>
        </div>
        <div class="combat-demo-meter is-health"><i data-player-health></i></div>
        <div class="combat-demo-meter is-stamina"><i data-player-stamina></i></div>
        <div class="combat-demo-statuses" data-player-statuses></div>
    </section>

    <section class="combat-demo-enemy-hud" data-enemy-hud hidden aria-label="怪物狀態">
        <strong data-enemy-name></strong>
        <div class="combat-demo-meter is-enemy"><i data-enemy-health></i></div>
        <span data-enemy-intent></span>
    </section>

    <aside class="combat-demo-objective">
        <span>調查進度</span>
        <strong data-objective-title>確認南門外三處地標</strong>
        <div class="combat-demo-evidence" data-evidence-list></div>
    </aside>

    <div class="combat-demo-interaction" data-interaction hidden>
        <kbd>F</kbd>
        <span data-interaction-label></span>
    </div>

    <p class="combat-demo-message" data-combat-message hidden></p>
    <p class="combat-demo-pointer-lock-hint" data-pointer-lock-hint>點擊場景後可控制鏡頭；無法鎖定時移到畫面邊緣轉向</p>

    <section class="combat-demo-inventory">
        <header>
            <strong>暫存行囊</strong>
            <span data-inventory-count>0 / 10</span>
        </header>
        <div data-inventory-list></div>
    </section>

    <section class="combat-demo-card" data-story-card hidden>
        <span data-story-kicker>調查紀錄</span>
        <h2 data-story-title></h2>
        <div data-story-copy></div>
        <button type="button" data-story-close>收起紀錄</button>
    </section>

    <section class="combat-demo-card is-loot" data-loot-card hidden>
        <span>地面戰利品</span>
        <h2 data-loot-name></h2>
        <p data-loot-detail></p>
        <div>
            <button type="button" data-loot-take>放入行囊</button>
            <button type="button" data-loot-leave>留在原地</button>
        </div>
    </section>

    <section class="combat-demo-card is-complete" data-complete-card hidden>
        <span>第一章 3D 垂直切片</span>
        <h2 data-complete-title>銀線伏擊已排除</h2>
        <div data-complete-copy></div>
        <button type="button" data-complete-exit>返回城鎮</button>
    </section>

    <div class="combat-demo-controls" aria-label="操作說明">
        <span><kbd>WASD</kbd> 移動</span>
        <span><kbd>LMB</kbd> 三段輕擊</span>
        <span><kbd>RMB</kbd> 蓄力重擊</span>
        <span><kbd>SPACE</kbd> 翻滾</span>
        <span><kbd>Q</kbd> 鎖定</span>
        <span><kbd>R</kbd> 喝藥</span>
        <span><kbd>F</kbd> 互動</span>
    </div>

    <nav class="combat-demo-actions" aria-label="測試操作">
        <button type="button" data-demo-reset>重置切片</button>
        <button type="button" data-demo-exit>離開</button>
    </nav>

    <output class="combat-demo-performance" data-performance hidden></output>

    <div class="combat-demo-loading" data-demo-loading>
        <strong>正在建立南門外區域</strong>
        <span>載入玩家模型、房間模組與正式戰鬥資料</span>
    </div>
</main>
