<main class="combat-demo" data-combat-demo>

        aria-label="&#31532;&#19968;&#31456; 3D &#20882;&#38570;&#28204;&#35430;"></div>

    <header class="combat-demo-title">

            <strong>&#26053;&#20154;</strong>
            <span data-potion-count>&#25033;&#24613;&#34277;&#21137; 3</span>

        <div class="combat-demo-statuses" data-player-statuses></div>

    <section class="combat-demo-enemy-hud" data-enemy-hud hidden

    <aside class="combat-demo-objective">

        <strong data-objective-title>&#30906;&#35469;&#21335;&#38272;&#22806;&#19977;&#34389;&#22320;&#27161;</strong>

    <section class="combat-demo-weapons" aria-label="&#27494;&#22120;&#21205;&#20316;&#28204;&#35430;">
        <button type="button" data-weapon-form="sword" aria-pressed="true">
            <kbd>1</kbd><span>&#38263;&#21133;</span>

        <button type="button" data-weapon-form="dagger" aria-pressed="false">
            <kbd>2</kbd><span>&#21269;&#39318;</span>

        <button type="button" data-weapon-form="heavy" aria-pressed="false">
            <kbd>3</kbd><span>&#37325;&#27494;&#22120;</span>
        </button>
        <button type="button" data-weapon-form="lance" aria-pressed="false">
            <kbd>4</kbd><span>&#38263;&#27385;</span>
        </button>
        <button type="button" data-weapon-form="focus" aria-pressed="false">
            <kbd>5</kbd><span>&#27861;&#26454;</span>
        </button>
    </section>

    <div class="combat-demo-interaction" data-interaction hidden>
        <kbd>F</kbd>
        <span data-interaction-label></span>
    </div>

    <p class="combat-demo-message" data-combat-message hidden></p>

        &#28369;&#40736;&#25351;&#21521;&#25915;&#25802;&#26041;&#21521;&#65307;&#31227;&#21040;&#30059;&#38754;&#37002;&#32227;&#21487;&#26059;&#36681;&#37857;&#38957;

            <strong>&#26283;&#23384;&#34892;&#22218;</strong>

        </header>
        <div data-inventory-list></div>

    <section class="combat-demo-card" data-story-card hidden>
        <span data-story-kicker>&#35519;&#26597;&#32000;&#37636;</span>
        <h2 data-story-title></h2>
        <div data-story-copy></div>
        <button type="button" data-story-close>&#25910;&#36215;&#32000;&#37636;</button>
    </section>

    <section class="combat-demo-card is-loot" data-loot-card hidden>
        <span>&#22320;&#38754;&#25136;&#21033;&#21697;</span>

        <p data-loot-detail></p>
        <div>
            <button type="button" data-loot-take>&#25918;&#20837;&#34892;&#22218;</button>
            <button type="button" data-loot-leave>&#30041;&#22312;&#21407;&#22320;</button>

    <section class="combat-demo-card is-complete" data-complete-card hidden>

    <div class="combat-demo-controls" aria-label="&#25805;&#20316;&#35498;&#26126;">

        <span><kbd>LMB</kbd> &#36629;&#25802;</span>

        <span><kbd>R</kbd> &#21917;&#34277;</span>
        <span><kbd>F</kbd> &#20114;&#21205;</span>

        <button type="button" data-demo-reset>&#37325;&#32622;&#20999;&#29255;</button>
        <button type="button" data-demo-exit>&#38626;&#38283;</button>
