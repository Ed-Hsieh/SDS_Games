<!-- 任務冊視覺背景 -->
<div class="quest-board-container">
    <div class="quest-story-ledger">
        <div>
            <span class="ledger-kicker">Quest Ledger</span>
            <h2>任務冊</h2>
        </div>
        <div class="ledger-summary" id="ledger-summary">0 件委託</div>
    </div>

    <div class="quest-tabs handbook-tabs" id="handbook-tabs" role="tablist" aria-label="任務冊分類">
        <button class="quest-tab active" type="button" role="tab" aria-selected="true" data-handbook-tab="commissions">
            <span class="tab-label">委託</span>
            <span class="badge" data-handbook-count="commissions">0</span>
        </button>
        <button class="quest-tab" type="button" role="tab" aria-selected="false" data-handbook-tab="boss">
            <span class="tab-label">首領痕跡</span>
            <span class="badge" data-handbook-count="boss">0</span>
        </button>
        <button class="quest-tab" type="button" role="tab" aria-selected="false" data-handbook-tab="world">
            <span class="tab-label">世界見聞</span>
            <span class="badge" data-handbook-count="world">0</span>
        </button>
        <button class="quest-tab" type="button" role="tab" aria-selected="false" data-handbook-tab="relationships">
            <span class="tab-label">城鎮人際</span>
            <span class="badge" data-handbook-count="relationships">0</span>
        </button>
        <button class="quest-tab" type="button" role="tab" aria-selected="false" data-handbook-tab="town">
            <span class="tab-label">城鎮記憶</span>
            <span class="badge" data-handbook-count="town">0</span>
        </button>
    </div>

    <!-- 任務面板主體 -->
    <div class="quest-main-panel">
        <!-- 左側：任務列表 -->
        <div class="quest-list-panel">
            <div class="quest-list-header">
                <h3 id="list-title">所有委託</h3>
                <span class="quest-count" id="quest-count">0 筆紀錄</span>
            </div>
            <div class="quest-list" id="quest-list">
                <!-- 任務項目動態生成 -->
                <div class="quest-empty" id="quest-empty">
                    <div class="empty-icon">📭</div>
                    <p>目前沒有任務</p>
                </div>
            </div>
        </div>

        <!-- 右側：任務詳情 -->
        <div class="quest-detail-panel" id="quest-detail">
            <div class="detail-placeholder" id="detail-placeholder">
                <div class="placeholder-icon">📖</div>
                <p>選擇一段紀錄查看來龍去脈與下一步</p>
            </div>

            <div class="detail-content hidden" id="detail-content">
                <!-- 任務標題 -->
                <div class="detail-header">
                    <div class="quest-icon" id="detail-icon">📜</div>
                    <div class="quest-title-group">
                        <h2 id="detail-name">任務名稱</h2>
                        <div class="quest-type-badge" id="detail-type">主線</div>
                    </div>
                </div>

                <!-- NPC 對話 -->
                <div class="quest-dialogue-box" id="detail-dialogue">
                    <div class="npc-avatar" id="npc-avatar">👨</div>
                    <div class="dialogue-bubble">
                        <span class="npc-name" id="npc-name">委託人</span>
                        <p id="detail-dialogue-text">任務描述...</p>
                    </div>
                </div>

                <!-- 任務紀錄 -->
                <div class="quest-objectives">
                    <h4 id="detail-objectives-title">📋 紀錄內容</h4>
                    <ul class="objectives-list" id="detail-objectives">
                        <!-- 動態生成 -->
                    </ul>
                </div>

                <!-- 回報收穫 -->
                <div class="quest-rewards">
                    <h4 id="detail-rewards-title">🎁 回報</h4>
                    <div class="rewards-grid" id="detail-rewards">
                        <!-- 動態生成 -->
                    </div>
                </div>

                <!-- 操作按鈕 -->
                <div class="quest-actions" id="detail-actions">
                    <button class="quest-btn accept-btn" id="btn-accept">
                        <span class="btn-icon">✅</span>
                        接下委託
                    </button>
                    <button class="quest-btn abandon-btn hidden" id="btn-abandon">
                        <span class="btn-icon">❌</span>
                        停止追蹤
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部操作欄 -->
    <div class="quest-footer">
        <button class="footer-btn" id="btn-back-lobby">
            <span class="btn-icon">🏠</span>
            返回大廳
        </button>
        <div class="quest-summary">
            <span class="summary-item" title="紀錄中">
                <span class="summary-icon">✎</span>
                <span id="summary-active">0</span>
            </span>
            <span class="summary-item" title="待回報">
                <span class="summary-icon">📌</span>
                <span id="summary-completed">0</span>
            </span>
            <span class="summary-item" title="已記錄">
                <span class="summary-icon">✓</span>
                <span id="summary-finished">0</span>
            </span>
        </div>
    </div>
</div>

<!-- 任務通知改由任務冊本身更新，不使用彈跳 toast。 -->
