<!-- 任務公告板視覺背景 -->
<div class="quest-board-container">
    <div class="quest-story-ledger">
        <div>
            <span class="ledger-kicker">Story Ledger</span>
            <h2>故事線索簿</h2>
        </div>
        <div class="ledger-summary" id="ledger-summary">0 條線索</div>
    </div>

    <!-- 任務面板主體 -->
    <div class="quest-main-panel">
        <!-- 左側：任務列表 -->
        <div class="quest-list-panel">
            <div class="quest-list-header">
                <h3 id="list-title">所有線索</h3>
                <span class="quest-count" id="quest-count">0 個任務</span>
            </div>
            <div class="quest-list" id="quest-list">
                <!-- 任務項目動態生成 -->
                <div class="quest-empty" id="quest-empty">
                    <div class="empty-icon">📭</div>
                    <p>目前沒有任務</p>
                </div>
            </div>
        </div>

        <!-- 右側：任務詳情 -->
        <div class="quest-detail-panel" id="quest-detail">
            <div class="detail-placeholder" id="detail-placeholder">
                <div class="placeholder-icon">📖</div>
                <p>選擇一條線索查看故事與下一步</p>
            </div>

            <div class="detail-content hidden" id="detail-content">
                <!-- 任務標題 -->
                <div class="detail-header">
                    <div class="quest-icon" id="detail-icon">📜</div>
                    <div class="quest-title-group">
                        <h2 id="detail-name">任務名稱</h2>
                        <div class="quest-type-badge" id="detail-type">主線</div>
                    </div>
                </div>

                <!-- NPC 對話 -->
                <div class="quest-dialogue-box" id="detail-dialogue">
                    <div class="npc-avatar" id="npc-avatar">👨</div>
                    <div class="dialogue-bubble">
                        <span class="npc-name" id="npc-name">委託人</span>
                        <p id="detail-dialogue-text">任務描述...</p>
                    </div>
                </div>

                <!-- 線索紀錄 -->
                <div class="quest-objectives">
                    <h4>📋 線索紀錄</h4>
                    <ul class="objectives-list" id="detail-objectives">
                        <!-- 動態生成 -->
                    </ul>
                </div>

                <!-- 回報收穫 -->
                <div class="quest-rewards">
                    <h4>🎁 回報收穫</h4>
                    <div class="rewards-grid" id="detail-rewards">
                        <!-- 動態生成 -->
                    </div>
                </div>

                <!-- 操作按鈕 -->
                <div class="quest-actions" id="detail-actions">
                    <button class="quest-btn accept-btn" id="btn-accept">
                        <span class="btn-icon">✅</span>
                        開始記錄
                    </button>
                    <button class="quest-btn abandon-btn hidden" id="btn-abandon">
                        <span class="btn-icon">❌</span>
                        放棄任務
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部操作欄 -->
    <div class="quest-footer">
        <button class="footer-btn" id="btn-back-lobby">
            <span class="btn-icon">🏠</span>
            返回大廳
        </button>
        <div class="quest-summary">
            <span class="summary-item" title="紀錄中">
                <span class="summary-icon">✎</span>
                <span id="summary-active">0</span>
            </span>
            <span class="summary-item" title="可回報">
                <span class="summary-icon">📌</span>
                <span id="summary-completed">0</span>
            </span>
            <span class="summary-item" title="已記錄">
                <span class="summary-icon">✓</span>
                <span id="summary-finished">0</span>
            </span>
        </div>
    </div>
</div>

<!-- 任務通知改由線索簿本身更新，不使用彈跳 toast。 -->
