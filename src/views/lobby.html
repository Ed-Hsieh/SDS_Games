<div class="hall-scene">
    <main class="lobby-shell">
        <aside class="lobby-sidebar lobby-sidebar-left">
            <section class="lobby-panel traveler-board">
                <div class="traveler-board-head">
                    <div>
                        <span>旅人</span>
                        <strong>城鎮整備</strong>
                    </div>
                    <div class="character-gold" aria-label="金幣">
                        <span class="character-gold-label">金幣</span>
                        <strong class="character-gold-value" id="character-gold">100</strong>
                    </div>
                </div>

                <div class="save-controls" aria-label="存檔操作">
                    <button class="save-action" id="btn-save-export" type="button" title="匯出 JSON 存檔">存檔</button>
                    <button class="save-action" id="btn-save-import" type="button" title="讀取 JSON 存檔">讀取</button>
                    <button class="save-action save-action-danger" id="btn-save-reset" type="button" title="重置目前進度">重置</button>
                    <input id="save-file-input" type="file" accept="application/json,.json" hidden>
                </div>

                <div class="traveler-core">
                    <div class="character-level">
                        <span class="character-level-label">等級</span>
                        <strong class="character-level-value" id="character-level">1</strong>
                    </div>
                    <div class="traveler-bars">
                        <div class="stat-row">
                            <span class="stat-label">生命</span>
                        </div>
                        <div class="progress-bar-container">
                            <div class="progress-bar progress-bar-hp" id="hp-bar" style="width: 100%;"></div>
                            <span class="progress-bar-text" id="hp-text">120 / 120</span>
                        </div>

                        <div class="stat-row">
                            <span class="stat-label">經驗</span>
                        </div>
                        <div class="progress-bar-container">
                            <div class="progress-bar progress-bar-exp" id="exp-bar" style="width: 0%;"></div>
                            <span class="progress-bar-text" id="exp-text">0 / 100</span>
                        </div>
                    </div>
                </div>

                <div class="attributes-panel">
                    <div class="attribute-box">
                        <div class="attribute-label">攻擊</div>
                        <div class="attribute-value" id="character-atk">5</div>
                    </div>
                    <div class="attribute-box">
                        <div class="attribute-label">防禦</div>
                        <div class="attribute-value" id="character-def">2</div>
                    </div>
                </div>

                <section class="character-equipment" aria-label="目前穿戴">
                    <div class="equipment-head">
                        <span>裝備</span>
                        <strong>目前穿戴</strong>
                    </div>
                    <div class="equipment-slots">
                        <div class="equipment-slot empty" id="slot-weapon" data-slot-type="weapon">
                            <div class="equipment-slot-label">武器</div>
                            <div class="equipment-slot-icon">⚔️</div>
                            <div class="equipment-slot-name">未裝備</div>
                        </div>
                        <div class="equipment-slot empty" id="slot-armor" data-slot-type="armor">
                            <div class="equipment-slot-label">防具</div>
                            <div class="equipment-slot-icon">🛡️</div>
                            <div class="equipment-slot-name">未裝備</div>
                        </div>
                        <div class="equipment-slot empty" id="slot-accessory" data-slot-type="accessory">
                            <div class="equipment-slot-label">飾品</div>
                            <div class="equipment-slot-icon">💍</div>
                            <div class="equipment-slot-name">未裝備</div>
                        </div>
                    </div>
                    <div id="active-set-bonuses" class="set-bonuses" aria-live="polite"></div>
                    <div id="character-set-status" class="character-set-status"></div>
                </section>

                <section class="passive-effect-panel" aria-label="永久戰鬥效果">
                    <div class="passive-effect-head">
                        <span>戰鬥記憶</span>
                        <strong>永久戰鬥效果</strong>
                    </div>
                    <div class="passive-effect-slots" id="passive-effect-slots" aria-label="已裝備被動效果"></div>
                    <div class="passive-effect-library" id="passive-effect-library" aria-label="可替換被動效果"></div>
                </section>
            </section>
        </aside>

        <section class="lobby-world">
            <section class="town-narrative-panel" id="town-narrative" aria-live="polite">
                <div class="town-narrative-head">
                    <span class="town-narrative-kicker">場景</span>
                    <strong id="town-narrative-title">城鎮十字路</strong>
                </div>
                <div class="town-story-board" id="world-story-log">
                    <div class="town-dialogue-stream" id="town-dialogue-stream">
                        <article class="town-story-entry">
                            <span class="world-log-title">抵達</span>
                            <p class="world-log-message">夜裡的風帶著鐵屑與濕土氣味，幾張新紙被釘在廣場邊。</p>
                        </article>
                    </div>
                </div>
            </section>

            <section class="world-stage" id="world-stage" aria-label="城鎮探索">
                <div class="world-stage-backdrop">
                    <div class="town-sky"></div>
                    <div class="town-roofs"></div>
                    <div class="town-plaza"></div>
                    <div class="town-road town-road-main"></div>
                    <div class="town-road town-road-side"></div>

                    <button class="world-hotspot hotspot-board" data-interaction-id="crossroads_notice_board">
                        <span class="hotspot-icon">📌</span>
                        <span class="hotspot-label">公告欄</span>
                    </button>
                    <button class="world-hotspot hotspot-cache" data-interaction-id="field_blueprint_cache">
                        <span class="hotspot-icon">📜</span>
                        <span class="hotspot-label">圖匣</span>
                    </button>
                    <button class="world-hotspot hotspot-tablet" data-interaction-id="ruin_tablet_trace">
                        <span class="hotspot-icon">🪨</span>
                        <span class="hotspot-label">刻痕石碑</span>
                    </button>
                    <button class="world-route hotspot-shop" data-route="shop">
                        <span class="hotspot-icon">🛒</span>
                        <span class="hotspot-label">市集</span>
                    </button>
                    <button class="world-route hotspot-gamble" data-route="casino">
                        <span class="hotspot-icon">🎲</span>
                        <span class="hotspot-label">賭場</span>
                    </button>
                    <button class="world-route hotspot-quest" data-route="quest">
                        <span class="hotspot-icon">📜</span>
                        <span class="hotspot-label">線索簿</span>
                    </button>
                    <button class="world-route hotspot-codex" data-route="encyclopedia">
                        <span class="hotspot-icon">📖</span>
                        <span class="hotspot-label">百科</span>
                    </button>
                    <button class="world-route hotspot-tower" data-route="tower">
                        <span class="hotspot-icon">🗼</span>
                        <span class="hotspot-label">無盡塔</span>
                    </button>
                    <button class="world-route hotspot-gate" data-route="adventure">
                        <span class="hotspot-icon">⚔️</span>
                        <span class="hotspot-label">城外道路</span>
                    </button>
                    <button class="world-route hotspot-forge" data-route="forge">
                        <span class="hotspot-icon">⚒️</span>
                        <span class="hotspot-label">鍛造鋪</span>
                    </button>
                </div>
            </section>
        </section>

        <aside class="lobby-sidebar lobby-sidebar-right">
            <section class="lobby-panel storage-board">
                <div class="storage-board-head">
                    <div>
                        <span>物資</span>
                        <strong>背包與倉庫</strong>
                    </div>
                    <strong class="inventory-capacity"><span id="inventory-used">0</span> / <span id="inventory-max">10</span></strong>
                </div>

                <section class="inventory-section storage-section" aria-label="背包">
                    <div class="storage-section-head">
                        <span>背包</span>
                        <strong>隨身物品</strong>
                    </div>
                    <div class="inventory-list" id="inventory-list"></div>
                </section>

                <section class="warehouse-info storage-section" aria-label="倉庫">
                    <div class="storage-section-head warehouse-heading">
                        <span>倉庫</span>
                        <strong>戰利品整理</strong>
                    </div>
                    <div class="warehouse-controls">
                        <select class="warehouse-sort" id="warehouse-sort">
                            <option value="time-desc">最新獲得</option>
                            <option value="time-asc">最舊獲得</option>
                            <option value="rarity-desc">稀有度 ↓</option>
                            <option value="rarity-asc">稀有度 ↑</option>
                        </select>
                        <div class="warehouse-filters">
                            <button class="warehouse-filter active" data-filter="all">全部</button>
                            <button class="warehouse-filter" data-filter="weapon">⚔️</button>
                            <button class="warehouse-filter" data-filter="armor">🛡️</button>
                            <button class="warehouse-filter" data-filter="accessory">💍</button>
                            <button class="warehouse-filter" data-filter="potion">🧪</button>
                            <button class="warehouse-filter" data-filter="material">⛏️</button>
                        </div>
                    </div>
                    <div class="warehouse-list" id="warehouse-list"></div>
                </section>
            </section>
        </aside>
    </main>
</div>

<!-- Item detail modal is provided by the centralized component `ItemDetailModal` -->
