<main class="adventure-scene adventure-map-v2">
    <header class="adventure-header">
        <div class="region-identity">
            <span id="adventure-region-subtitle">第一區域</span>
            <strong id="adventure-region-title">南門外林地</strong>
            <small id="adventure-habitat-name">南門荒地</small>
        </div>

        <div class="adventure-player-status" aria-label="角色狀態">
            <div class="adventure-stat">
                <span>等級</span>
                <b id="adv-player-level">1</b>
            </div>
            <div class="adventure-stat">
                <span>生命</span>
                <b id="adv-player-hp">100/100</b>
            </div>
            <div class="adventure-stat">
                <span>金幣</span>
                <b id="adv-player-gold">0</b>
            </div>
        </div>

        <button class="adventure-icon-button" id="btn-return-to-lobby" type="button" title="返回村落" aria-label="返回村落">
            <span aria-hidden="true">←</span>
        </button>
    </header>

    <section class="adventure-map-stage" aria-label="冒險地圖">
        <canvas id="world-map-canvas" tabindex="0"></canvas>

        <div class="map-region-toast" id="map-region-toast" aria-live="polite">
            <span>進入區域</span>
            <strong id="map-region-toast-title">南門荒地</strong>
            <p id="map-region-toast-text"></p>
        </div>

        <div class="map-location-hint" id="map-location-hint" aria-live="polite">
            <span class="map-location-key">F</span>
            <div>
                <strong id="map-location-hint-title">未知地點</strong>
                <p id="map-location-hint-text">靠近後調查。</p>
            </div>
        </div>

        <aside class="map-test-panel" id="map-test-panel" hidden>
            <header>
                <span>MAP PROTOTYPE</span>
                <strong>連續地圖測試</strong>
            </header>
            <div class="map-test-actions">
                <button type="button" data-map-test-action="goto-start">第一區起點</button>
                <button type="button" data-map-test-action="goto-gate">腐根斷橋</button>
                <button type="button" data-map-test-action="goto-chapter-two">第二區起點</button>
                <button type="button" data-map-test-action="repair-gate">修復斷橋</button>
                <button type="button" data-map-test-action="reset-gate">重置斷橋</button>
                <button type="button" data-map-test-action="reveal-all">揭開迷霧</button>
                <button type="button" data-map-test-action="reset-fog">重置迷霧</button>
                <button type="button" data-map-test-action="sample-monster">抽樣當地怪物</button>
                <button type="button" data-map-test-action="toggle-reserves">超格 Boss 預留點</button>
            </div>
            <p class="map-test-sample" id="map-test-sample">尚未抽樣</p>
            <ol class="map-test-boss-list" id="map-test-boss-list"></ol>
        </aside>
    </section>

    <div class="map-landmark-modal" id="map-landmark-modal" hidden>
        <article class="map-landmark-card" role="dialog" aria-modal="true" aria-labelledby="map-landmark-title">
            <button class="map-landmark-close" id="map-landmark-close" type="button" title="關閉" aria-label="關閉">×</button>
            <div class="map-landmark-image" id="map-landmark-image"></div>
            <div class="map-landmark-copy">
                <span id="map-landmark-kicker">地標已記錄</span>
                <h2 id="map-landmark-title">地標</h2>
                <p id="map-landmark-text"></p>
                <button class="map-landmark-confirm" id="map-landmark-confirm" type="button">繼續探索</button>
            </div>
        </article>
    </div>
</main>
