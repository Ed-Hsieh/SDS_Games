<div class="shop-supply-scene">
    <header class="shop-supply-topbar">
        <div>
            <span class="shop-kicker">城鎮供應線</span>
            <h1>市集邊棚</h1>
            <p id="shop-current-copy">把冒險帶回來的材料交給需要的人，讓城鎮的貨架、訂單與交換慢慢活起來。</p>
        </div>
        <div class="shop-topbar-actions">
            <div class="shop-wallet">
                <span>金幣</span>
                <strong id="player-gold">0</strong>
            </div>
            <button class="shop-return-btn" type="button" id="btn-exit-shop">返回</button>
        </div>
    </header>

    <main class="shop-supply-layout">
        <section class="market-stage" id="market-stage" aria-label="市集場景">
            <div class="market-stage-backdrop" aria-hidden="true"></div>
            <div class="market-stage-vendors" id="market-grid">
                <!-- NPC hotspots are rendered by ShopScene -->
            </div>
            <div class="market-stage-caption" id="market-stage-caption">
                左棚是藥草與瓶架，中央貨桌堆著路線與工具，最右側的門縫還沒有完全打開。
            </div>
        </section>

        <section class="supply-desk" id="trade-panel" aria-label="市集供應線">
            <div class="supply-vendor-card" id="vendor-card">
                <div class="vendor-portrait-shell" id="npc-drop-zone">
                    <img src="" alt="市集人物" class="npc-portrait" id="npc-portrait">
                    <span class="vendor-portrait-fallback" id="vendor-portrait-fallback">市</span>
                </div>
                <div class="vendor-card-copy">
                    <span class="section-eyebrow" id="vendor-place">市集</span>
                    <h2 id="vendor-name">市集人物</h2>
                    <p id="vendor-role">供應線</p>
                </div>
            </div>

            <div class="dialogue-box supply-dialogue" id="dialogue-box">
                <p>歡迎來到市集。</p>
            </div>

            <nav class="supply-tabs" aria-label="供應線分類">
                <button class="supply-tab active" type="button" data-panel="shelf">貨架</button>
                <button class="supply-tab" type="button" data-panel="orders">委託訂單</button>
                <button class="supply-tab" type="button" data-panel="exchange">交換</button>
            </nav>

            <div class="trade-status-panel is-info" id="trade-status" role="status" aria-live="polite">
                <div class="trade-status-icon" id="trade-status-icon">ℹ</div>
                <div class="trade-status-copy">
                    <div class="trade-status-title" id="trade-status-title">選擇市集人物</div>
                    <div class="trade-status-message" id="trade-status-message">貨架、訂單與交換會依照人物和故事狀態改變。</div>
                </div>
            </div>

            <div class="supply-panel" id="supply-panel">
                <!-- Supply cards are rendered by ShopScene -->
            </div>

            <div class="market-carry-panel">
                <div class="section-header compact">
                    <div>
                        <span class="section-eyebrow">BAG</span>
                        <h3>帶回物資</h3>
                    </div>
                    <span class="shop-section-hint">點擊出售</span>
                </div>
                <div class="player-inventory-list" id="player-inventory">
                    <!-- Player inventory rendered by ShopScene -->
                </div>
            </div>
        </section>
    </main>
</div>

<!-- Item modal centralized via ItemDetailModal component -->
