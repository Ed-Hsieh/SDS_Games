<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>市集 - SDS RPG</title>
    <link rel="stylesheet" href="../style/common.css">
    <link rel="stylesheet" href="../style/marketplace.css">
</head>
<body>
    <!-- 頂部戰術地圖網格 (15vh) -->
    <div class="market-tactical-grid" id="market-grid">
        <!-- 8個地圖格子 -->
        <div class="grid-tile" data-shop="blacksmith">
            <div class="tile-floor">
                <div class="shop-icon">⚔️</div>
                <div class="shop-label">鍛造</div>
            </div>
        </div>
        
        <div class="grid-tile" data-shop="alchemist">
            <div class="tile-floor">
                <div class="shop-icon">🧪</div>
                <div class="shop-label">煉金</div>
            </div>
        </div>
        
        <div class="grid-tile" data-shop="merchant">
            <div class="tile-floor">
                <div class="shop-icon">💰</div>
                <div class="shop-label">商人</div>
            </div>
        </div>
        
        <div class="grid-tile" data-shop="scholar">
            <div class="tile-floor">
                <div class="shop-icon">📜</div>
                <div class="shop-label">學者</div>
            </div>
        </div>
        
        <div class="grid-tile locked" data-shop="mystery1">
            <div class="tile-floor">
                <div class="shop-icon">❓</div>
                <div class="shop-label">???</div>
            </div>
        </div>
        
        <div class="grid-tile locked" data-shop="mystery2">
            <div class="tile-floor">
                <div class="shop-icon">❓</div>
                <div class="shop-label">???</div>
            </div>
        </div>
        
        <div class="grid-tile locked" data-shop="mystery3">
            <div class="tile-floor">
                <div class="shop-icon">❓</div>
                <div class="shop-label">???</div>
            </div>
        </div>
        
        <div class="grid-tile" data-shop="exit">
            <div class="tile-floor">
                <div class="shop-icon">🚪</div>
                <div class="shop-label">離開</div>
            </div>
        </div>
        
        <!-- 玩家標記 (動態定位) -->
        <div class="player-token" id="player-token">
            <div class="token-avatar">🧙</div>
        </div>
    </div>

    <!-- 主要內容區 (85vh) -->
    <div class="market-content">
        <!-- 左側：NPC互動面板 (40%) -->
        <div class="npc-panel" id="npc-panel">
            <div class="npc-portrait-container" id="npc-drop-zone">
                <img src="" alt="NPC Portrait" class="npc-portrait" id="npc-portrait">
                <div class="drop-hint" id="drop-hint">拖曳特殊物品至此...</div>
            </div>
            
            <div class="npc-dialogue">
                <div class="dialogue-box" id="dialogue-box">
                    <p>歡迎來到市集。</p>
                </div>
            </div>
        </div>

        <!-- 右側：交易面板 (60%) -->
        <div class="trade-panel" id="trade-panel">
            <!-- 上半部：商店貨物 (購買) -->
            <div class="trade-section vendor-section">
                <div class="section-header">
                    <h3>商店貨物</h3>
                </div>
                <div class="shop-inventory" id="shop-inventory">
                    <!-- 商店物品動態生成 -->
                </div>
            </div>

            <!-- 下半部：玩家背包 (出售) -->
            <div class="trade-section player-section">
                <div class="section-header">
                    <h3>你的背包</h3>
                    <span class="gold-display" id="player-gold">💰 0</span>
                </div>
                <div class="player-inventory-list" id="player-inventory">
                    <!-- 玩家物品動態生成 (可拖曳) -->
                </div>
            </div>
        </div>
    </div>

    <!-- 物品詳情模態視窗 -->
    <div class="modal-overlay" id="item-modal">
        <div class="modal-card">
            <button class="modal-close" id="modal-close">×</button>
            <div class="modal-header">
                <div class="modal-icon-wrapper">
                    <div class="modal-icon" id="modal-item-icon"></div>
                </div>
                <div class="modal-title-group">
                    <h2 class="modal-title" id="modal-item-name"></h2>
                    <div class="modal-rarity-badge" id="modal-item-rarity"></div>
                </div>
            </div>
            <div class="modal-body">
                <div class="modal-stats-grid" id="modal-item-stats">
                    <!-- 屬性動態生成 -->
                </div>
                <p class="modal-description" id="modal-item-desc"></p>
            </div>
            <div class="modal-footer">
                <button class="action-btn" id="modal-action-btn">
                    <span class="btn-label">購買</span>
                    <span class="btn-price">💰 100</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 載入 JavaScript -->
    <script src="../function/data-model.js"></script>
    <script src="../function/marketplace-controller.js"></script>
</body>
</html>
